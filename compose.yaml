x-db-env: &db-env
  PGHOST: ${POSTGRES_HOST:?Configurar host}
  PGPORT: '5432'
  PGDATABASE: ${DB_NAME:-postgres}
  PGUSER: ${POSTGRES_USERNAME:?Configurar usuario}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Configurar clave}
  # DB_SSLMODE/DB_SSLROOTCERT se exponen para que preflight y el chequeo PHP los lean
  # via getenv(); PGSSLMODE/PGSSLROOTCERT siguen siendo la copia libpq del mismo valor.
  DB_SSLMODE: ${DB_SSLMODE:-verify-full}
  DB_SSLROOTCERT: ${DB_SSLROOTCERT:-/run/supabase/ca.crt}
  PGSSLMODE: ${DB_SSLMODE:-verify-full}
  PGSSLROOTCERT: ${DB_SSLROOTCERT:-/run/supabase/ca.crt}
  PGCONNECT_TIMEOUT: '15'
services:
  preflight:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      <<: *db-env
      SUPABASE_DEDICATED_CONFIRMED: ${SUPABASE_DEDICATED_CONFIRMED:-false}
      SUPABASE_DATA_API_DISABLED: ${SUPABASE_DATA_API_DISABLED:-false}
    volumes: [./certs:/run/supabase:ro, ./ops:/opt/hefesto:ro]
    entrypoint: [/bin/sh, /opt/hefesto/preflight.sh]
  app:
    build: .
    image: hefesto-enlaces:5.1.7
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      preflight: {condition: service_completed_successfully}
    environment:
      DB_DRIVER: postgres
      DB_NAME: ${DB_NAME:-postgres}
      DB_HOST: ${POSTGRES_HOST:?Configurar host}
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USERNAME:?Configurar usuario}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configurar clave}
      # TLS is explicitly enforced by zz-hefesto.global.php at DBAL connection level.
      DB_USE_ENCRYPTION: 'false'
      DB_SSLMODE: ${DB_SSLMODE:-verify-full}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-/run/supabase/ca.crt}
      PGSSLMODE: ${DB_SSLMODE:-verify-full}
      PGSSLROOTCERT: ${DB_SSLROOTCERT:-/run/supabase/ca.crt}
      PGCONNECT_TIMEOUT: '15'
      DEFAULT_DOMAIN: ${LINKS_HOST:?Configurar dominio corto}
      IS_HTTPS_ENABLED: 'true'
      TIMEZONE: UTC
      CORS_ALLOW_ORIGIN: https://${PANEL_HOST:?Configurar panel}
      CORS_ALLOW_CREDENTIALS: 'false'
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      DISABLE_IP_TRACKING: 'true'
      DISABLE_REFERRER_TRACKING: 'true'
      DISABLE_UA_TRACKING: 'true'
      TRACK_ORPHAN_VISITS: 'false'
      ANONYMIZE_REMOTE_ADDR: 'true'
      AUTO_RESOLVE_TITLES: 'false'
      REDIRECT_STATUS_CODE: '302'
      WEB_WORKER_NUM: '2'
      TASK_WORKER_NUM: '1'
      SKIP_INITIAL_GEOLITE_DOWNLOAD: 'true'
      INITIAL_API_KEY: ${INITIAL_API_KEY:-}
    volumes: [./certs:/run/supabase:ro]
    expose: ['8080']
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/rest/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  panel:
    image: shlinkio/shlink-web-client:4.8.1@sha256:dc8bf3565a25bd0602ff11ee352920830ce457ab58a2b2c62f2ebb23e8c8b9ee
    restart: unless-stopped
    expose: ['8080']
  dbtools:
    image: postgres:17-alpine
    profiles: [tools]
    environment: *db-env
    volumes: [./certs:/run/supabase:ro]
